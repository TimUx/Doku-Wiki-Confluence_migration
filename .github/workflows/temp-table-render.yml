name: temp-table-render

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Patch table rendering and add tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('internal/render/render.go')
          s = p.read_text()
          old_html = '''case "table_row":b.WriteString(`<table class=\\"dokuwiki-table\\"><tbody>`);for _,c:=range n.Children{tag:=\\"td\\";if c.Type==\\"table_header\\"{tag=\\"th\\"};span:=\\"\\";if c.Meta!=nil&&c.Meta[\\"colspan\\"]!=\\"\\"{span=` colspan=\\"`+c.Meta[\\"colspan\\"]+`\\"`};fmt.Fprintf(&b,\\"<%s%s>%s</%s>\\",tag,span,Inline(c.Text),tag)};b.WriteString(\\"</tbody></table>\\")'''
          new_html = '''case "table_row":renderTableHTML(&b,p.Nodes,&i,false,p.ID)'''
          old_preview = '''case "table_row":b.WriteString(`<table class=\\"dokuwiki-table\\"><tbody>`);for _,c:=range n.Children{tag:=\\"td\\";if c.Type==\\"table_header\\"{tag=\\"th\\"};span:=\\"\\";if c.Meta!=nil&&c.Meta[\\"colspan\\"]!=\\"\\"{span=` colspan=\\"`+html.EscapeString(c.Meta[\\"colspan\\"])+`\\"`};fmt.Fprintf(&b,\\"<%s%s>%s</%s>\\",tag,span,previewInline(c.Text,p.ID),tag)};b.WriteString(\\"</tbody></table>\\")'''
          new_preview = '''case "table_row":renderTableHTML(&b,p.Nodes,&i,true,p.ID)'''
          old_md = '''case "table_row":b.WriteString("| ");for i,c:=range n.Children{if i>0{b.WriteString(" | ")};b.WriteString(c.Text)};b.WriteString(" |\\n")'''
          new_md = '''case "table_row":renderTableMarkdown(&b,p.Nodes,&i)'''
          for old,new in ((old_html,new_html),(old_preview,new_preview),(old_md,new_md)):
              if old not in s:
                  raise SystemExit(f'missing replacement: {old[:80]}')
              s=s.replace(old,new,1)
          marker='''func renderListHTML(nodes []model.Node,i *int,preview bool,current string)string{'''
          helpers='''func renderTableHTML(b *strings.Builder,nodes []model.Node,i *int,preview bool,current string){start:=*i;for *i<len(nodes)&&nodes[*i].Type=="table_row"{*i++};end:=*i-1;if end<start{return};b.WriteString(`<table class="dokuwiki-table">`);headerEnd:=start;for headerEnd<=end&&tableHeaderRow(nodes[headerEnd]){headerEnd++};if headerEnd>start{b.WriteString("<thead>");for j:=start;j<headerEnd;j++{renderTableHTMLRow(b,nodes[j],preview,current)};b.WriteString("</thead>")};if headerEnd<=end{b.WriteString("<tbody>");for j:=headerEnd;j<=end;j++{renderTableHTMLRow(b,nodes[j],preview,current)};b.WriteString("</tbody>")};b.WriteString("</table>");*i=end}\nfunc renderTableHTMLRow(b *strings.Builder,n model.Node,preview bool,current string){b.WriteString("<tr>");for _,c:=range n.Children{tag:="td";if c.Type=="table_header"{tag="th"};span:="";if c.Meta!=nil&&c.Meta["colspan"]!=""{span=` colspan="`+html.EscapeString(c.Meta["colspan"])+`"`};text:=Inline(c.Text);if preview{text=previewInline(c.Text,current)};fmt.Fprintf(b,"<%s%s>%s</%s>",tag,span,text,tag)};b.WriteString("</tr>")}\nfunc tableHeaderRow(n model.Node)bool{if len(n.Children)==0{return false};for _,c:=range n.Children{if c.Type!="table_header"{return false}};return true}\n'''
          if marker not in s:
              raise SystemExit('missing helper marker')
          s=s.replace(marker,helpers+marker,1)
          marker2='''func renderListMarkdown(nodes []model.Node,i *int)string{'''
          md='''func renderTableMarkdown(b *strings.Builder,nodes []model.Node,i *int){start:=*i;for *i<len(nodes)&&nodes[*i].Type=="table_row"{*i++};end:=*i-1;if end<start{return};if tableHeaderRow(nodes[start]){writeTableMarkdownRow(b,nodes[start]);b.WriteString("| ");for range nodes[start].Children{b.WriteString("--- | ")};b.WriteByte('\\n');for j:=start+1;j<=end;j++{writeTableMarkdownRow(b,nodes[j])}}else{for j:=start;j<=end;j++{writeTableMarkdownRow(b,nodes[j])}};*i=end}\nfunc writeTableMarkdownRow(b *strings.Builder,n model.Node){b.WriteString("| ");for j,c:=range n.Children{if j>0{b.WriteString(" | ")};b.WriteString(strings.ReplaceAll(c.Text,"|","\\\\|"))};b.WriteString(" |\\n")}\n'''
          if marker2 not in s:
              raise SystemExit('missing markdown marker')
          s=s.replace(marker2,md+marker2,1)
          p.write_text(s)

          Path('internal/render/table_render_test.go').write_text(r'''package render

import (
    "strings"
    "testing"

    "github.com/TimUx/Doku-Wiki-Confluence_migration/internal/parser"
)

func TestHTMLRendersContiguousTableAsSingleTable(t *testing.T) {
    p := parser.Parse("demo:table", `^ Name ^ Value ^
| Alpha | 1 |
| Beta | 2 |`)
    got := HTML(p)
    if strings.Count(got, `<table class="dokuwiki-table">`) != 1 {
        t.Fatalf("expected one table, got: %s", got)
    }
    if !strings.Contains(got, "<thead><tr><th>Name</th><th>Value</th></tr></thead>") {
        t.Fatalf("expected semantic header row, got: %s", got)
    }
    if !strings.Contains(got, "<tbody><tr><td>Alpha</td><td>1</td></tr><tr><td>Beta</td><td>2</td></tr></tbody>") {
        t.Fatalf("expected all body rows in one tbody, got: %s", got)
    }
}

func TestPreviewHTMLRendersTableCellLinksAndColspan(t *testing.T) {
    p := parser.Parse("demo:table", `^ Name ^ Value ^
| [[https://example.com|Example]] | ::: |
| Combined | 2 |`)
    got := PreviewHTML(p)
    if !strings.Contains(got, `href="https://example.com"`) {
        t.Fatalf("expected preview link, got: %s", got)
    }
    if !strings.Contains(got, `colspan="2"`) {
        t.Fatalf("expected colspan, got: %s", got)
    }
    if strings.Count(got, `<table class="dokuwiki-table">`) != 1 {
        t.Fatalf("expected one preview table, got: %s", got)
    }
}

func TestMarkdownRendersHeaderSeparatorAndEscapesPipes(t *testing.T) {
    p := parser.Parse("demo:table", `^ Name ^ Value ^
| Alpha | one | two |
| Beta | 2 |`)
    got := Markdown(p)
    if !strings.Contains(got, "| Name | Value |\n| --- | --- |\n") {
        t.Fatalf("expected markdown header separator, got: %s", got)
    }
    if !strings.Contains(got, `| Alpha | one | two |`) {
        t.Fatalf("expected markdown body row, got: %s", got)
    }
}
''')
      - name: Format
        run: gofmt -w internal/render/render.go internal/render/table_render_test.go
      - name: Test
        run: go test ./...
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/render/render.go internal/render/table_render_test.go
          git diff --cached --quiet || git commit -m "fix(render): render contiguous tables correctly"
          git push
