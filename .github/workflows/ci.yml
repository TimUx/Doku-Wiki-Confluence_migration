name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Vet & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod and go.sum
        run: go mod tidy -diff

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: dokuwiki-confluence-migrator-linux-amd64
          path: dist/dokuwiki-confluence-migrator
          if-no-files-found: error
          retention-days: 14
